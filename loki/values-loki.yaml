# Actual values.yaml file: https://github.com/grafana/loki/blob/main/production/helm/loki/values.yaml


loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1


read:
  replicas: 1
  persistence:
    storageClass: standard

write:
  replicas: 1
  persistence:
    storageClass: standard

backend:
  replicas: 1
  persistence:
    storageClass: standard


